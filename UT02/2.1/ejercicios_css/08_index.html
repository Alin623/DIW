<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarea 8 - Formulario flexbox</title>
  <link rel="stylesheet" href="08_index.css">
</head>
<body>
  <form>
    <div class="fila">
      <label for="nombre">First name</label>
      <input class="campo" type="text" id="nombre" placeholder="Enter your first name here">
    </div>
    <div class="fila">
      <label for="apellidos">Last name</label>
      <input class="campo" type="text" id="apellidos" placeholder="Enter your last name here">
    </div>
    <div class="fila">
      <label for="email">Email</label>
      <input class="campo" type="email" id="email" placeholder="Enter your email here">
    </div>
    <div class="fila">
      <label for="telefono">Phone</label>
      <input class="campo" type="tel" id="telefono" placeholder="Enter your phone here">
    </div>
    <div class="fila">
      <label for="mensaje">Message</label>
      <textarea class="campo" id="mensaje" placeholder="Enter your message here"></textarea>
    </div>
    <div class="fila">
      <label>Age</label>
      <div class="edades">
        <label><input type="checkbox"> 20-29</label>
        <label><input type="checkbox"> 30-39</label>
        <label><input type="checkbox"> 40-49</label>
        <label><input type="checkbox"> 50-59</label>
        <label><input type="checkbox"> &gt;60</label>
      </div>
    </div>
    <div class="fila">
      <button>Enviar</button>
    </div>
  </form>
</body>
</html>
